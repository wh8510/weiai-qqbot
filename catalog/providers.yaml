# Model catalog — data, not code.
#
# verified_at values are intentionally explicit. Model IDs, context windows and
# prices change frequently; update this file (or the catalog in the admin UI)
# instead of editing business logic.
#
# Pricing is per 1,000,000 tokens. `input`/`output` are the standard prices.
# `cacheRead` is the cached-input price when the provider exposes it. `peak`
# is an optional override for providers with time-of-day pricing.
version: 1
verifiedAt: "2026-10-25"

providers:
  - id: deepseek
    name: DeepSeek
    kind: openai
    baseUrl: https://api.deepseek.com/v1
    docs: https://api-docs.deepseek.com/zh-cn/quick_start/pricing
    models:
      - id: deepseek-flash
        name: DeepSeek V4.1 Flash
        context: 1000000
        maxOutput: 384000
        input: [text, image]
        output: [text]
        features: [json, tools, reasoning, cache, streaming]
        pricing:
          currency: CNY
          input: 1
          output: 4
          cacheRead: 0.02
          peak:
            input: 2
            output: 8
            cacheRead: 0.04
        source: https://api-docs.deepseek.com/zh-cn/guides/vision
        status: active
      - id: deepseek-v4-pro
        name: DeepSeek V4 Pro
        context: 1000000
        maxOutput: 384000
        input: [text]
        output: [text]
        features: [json, tools, reasoning, cache, streaming]
