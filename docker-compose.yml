services:
  bot:
    build: .
    env_file:
      - .env
    environment:
      BOT_DATA_DIR: /data
      BOT_HOST: 0.0.0.0
      BOT_PORT: 8080
    # Lets the bot container reach a NapCat container published on the host.
    # Use ONEBOT_URL=ws://host.docker.internal:3001 for that setup.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      # Keep the admin panel on localhost. Put Caddy / Nginx with HTTPS in
      # front, or access it over an SSH tunnel.
      - "127.0.0.1:8080:8080"
    volumes:
      - ./data:/data
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true

  # Optional TLS reverse proxy if you have a domain. Uncomment this service,
  # put your domain in deploy/Caddyfile.docker, and point DNS at this host.
  #
  # caddy:
  #   image: caddy:2
  #   depends_on:
  #     - bot
  #   ports:
  #     - "80:80"
  #     - "443:443"
  #   volumes:
  #     - ./deploy/Caddyfile.docker:/etc/caddy/Caddyfile:ro
  #     - caddy_data:/data
  #     - caddy_config:/config
  #   restart: unless-stopped
  #
  # volumes:
  #   caddy_data:
  #   caddy_config:
